<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base emblem background circle with subtle glass finish -->
  <circle cx="50" cy="50" r="46" fill="url(#primaryGrad)" fill-opacity="0.1" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="2 3"/>

  <!-- Main Open Book Motif -->
  <g filter="url(#glow)">
    <!-- Book Spine Center -->
    <path d="M50 28 V76 C50 77.2 49.2 78 48 77.5 C43 75.5 32 72 18 73 C16.5 73.1 15 72 15 70.5 V31 C15 29.8 16 28.9 17.2 29 C31 30.5 42 34 48.5 36 C49.5 36.3 50 35.8 50 35" fill="url(#primaryGrad)"/>
    
    <!-- Right Book Wing -->
    <path d="M50 28 V76 C50 77.2 50.8 78 52 77.5 C57 75.5 68 72 82 73 C83.5 73.1 85 72 85 70.5 V31 C85 29.8 84 28.9 82.8 29 C69 30.5 58 34 51.5 36 C50.5 36.3 50 35.8 50 35" fill="url(#accentGrad)"/>

    <!-- Left Inner Page Layer -->
    <path d="M47 38 C41 36 32 33.5 20 34 C19 34.1 18 34.9 18 36 V68 C30 67 40 69.5 47 72 Z" fill="#ffffff" fill-opacity="0.85"/>
    
    <!-- Right Inner Page Layer -->
    <path d="M53 38 C59 36 68 33.5 80 34 C81 34.1 82 34.9 82 36 V68 C70 67 60 69.5 53 72 Z" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Center Spine Ridge -->
    <path d="M50 26 C48.8 26 47.8 26.8 47.8 28 L48 78 C48 79.1 48.9 80 50 80 C51.1 80 52 79.1 52 78 L52.2 28 C52.2 26.8 51.2 26 50 26 Z" fill="#312e81"/>
  </g>

  <!-- Digital Circuit / Knowledge Sparks Rising Out of Book -->
  <g>
    <!-- Left Knowledge Flow Spark -->
    <path d="M42 28 C42 22 36 18 32 18" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="32" cy="18" r="3" fill="#06b6d4"/>

    <!-- Center Tech Ray -->
    <path d="M50 25 V14" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="13" r="3.5" fill="url(#goldGrad)"/>

    <!-- Right Knowledge Flow Spark -->
    <path d="M58 28 C58 20 66 16 72 15" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="72" cy="15" r="3" fill="#38bdf8"/>
    
    <circle cx="64" cy="22" r="2" fill="url(#goldGrad)"/>
    <circle cx="36" cy="24" r="2" fill="#818cf8"/>
  </g>

  <!-- Stylized Bookmark Ribbon -->
  <path d="M48.5 76 L50 78 L51.5 76 V56 H48.5 Z" fill="url(#goldGrad)"/>
</svg>
